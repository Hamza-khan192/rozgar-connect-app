# Rozgar Connect — free APK build on GitHub Actions
#
# HOW TO USE:
# 1. Is `app` folder ko GitHub repo ki root bana ke push karo
#    (repo ke andar pubspec.yaml, lib/, android/ directly hon).
# 2. GitHub repo page pe jao: Actions tab -> "Build Rozgar Connect APK" -> "Run workflow".
# 3. Build mukammal hone pe "Artifacts" me se `rozgar-connect-apk` download karo,
#    phone pe install karo. Bas!
#
# Ye workflow har push pe bhi khud chal jayega (branch: main).

name: Build Rozgar Connect APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rozgar-connect-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
